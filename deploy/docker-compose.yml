# Full local stack:  docker compose -f deploy/docker-compose.yml up --build
name: leakguard
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: leakguard, POSTGRES_PASSWORD: leakguard, POSTGRES_DB: leakguard}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U leakguard"], interval: 5s, retries: 10}
    ports: ["5432:5432"]

  api:
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    env_file: [../.env]
    environment:
      LG_DATABASE_URL: postgresql+psycopg://leakguard:leakguard@postgres:5432/leakguard
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8000:8000"]

  ui:
    build: {context: .., dockerfile: deploy/Dockerfile, target: ui}
    environment: {LEAKGUARD_API: "http://api:8000"}
    depends_on: [api]
    ports: ["8501:8501"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns --default-artifact-root /mlruns
    volumes: [../mlruns:/mlruns]
    ports: ["5000:5000"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["3000:3000"]

volumes:
  pgdata:
