[project]
name = "leakguard"
version = "0.1.0"
description = "Agentic LLM data-leakage prevention, redaction and policy-enforcement guard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jyotirmoy Konwar" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "cryptography>=43",
    "prometheus-client>=0.20",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "gliner>=0.2.13",
    "laya",
    "transformers>=4.44",
]
ui = ["streamlit>=1.38", "pandas>=2.2", "plotly>=5.22", "requests>=2.32"]
data = ["datasets>=2.20", "pandas>=2.2"]
train = ["mlflow>=2.15"]  # experiment tracking for the benchmark
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakguard"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ml: needs real ML models (gliner/laya) downloaded"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/leakguard"]
